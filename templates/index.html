<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savala Kiri Kiri 🌶️</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🌶️ Savala Kiri Kiri 🌶️</h1>
        <p class="subtitle">Click start and crunch like nobody's watching.</p>

        <div class="controls">
            <button id="startBtn" class="pulse">🎤 Start Listening</button>
            <button id="testBtn">📡 Send Manual Payload</button>
        </div>

        <div class="meter-wrap">
            <div id="meterFill" class="meter-fill"></div>
        </div>

        <div id="output" class="output-box">
            <p id="statusText">Status: Idle</p>
            <p id="roastText">Feedback will appear here...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
